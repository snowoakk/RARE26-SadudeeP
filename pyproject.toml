[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rare26-oak"
version = "1.0.0"
description = "RARE26 Barrett's Esophagus neoplasia classification pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm==0.9.12",
    "transformers",
    "huggingface-hub",
    "pandas",
    "numpy<2.0.0",
    "Pillow",
    "scikit-learn",
    "tqdm",
    "omegaconf",
    "opencv-python-headless",
    "scipy",
    "SimpleITK",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
